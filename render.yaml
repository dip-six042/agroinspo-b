services:
  - type: web
    name: agroinspo-b
    runtime: node
    # Starter (paid) is needed for a persistent disk; the free plan wipes data on every deploy/restart.
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: agroinspo-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://agroinspo-f.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://agroinspo-f.vercel.app
      - key: API_PUBLIC_URL
        value: https://agroinspo-b.onrender.com
      - key: DATABASE_FILE
        value: /var/data/agroinspo.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # First admin, created on start if missing. Values are entered in the Render dashboard, never committed.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOW_PAYOUT_SELF_APPROVAL
        value: "1"
      - key: KORA_MODE
        value: dummy
      - key: VIDEO_PROVIDER
        value: dummy
      - key: COMMISSION_CONSULTATION_PCT
        value: "10"
      - key: COMMISSION_EVENT_PCT
        value: "10"
      - key: COMMISSION_BOOK_PCT
        value: "10"
      - key: COMMISSION_SPONSORSHIP_PCT
        value: "10"
